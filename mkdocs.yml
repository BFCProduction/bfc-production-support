site_name: BFC Production Support
site_url: https://bfcproduction.github.io/bfc-production-support
theme:
  name: material
  logo: assets/bfc-logo.png
  favicon: assets/bfc-logo.png
  font: false
  palette:
    scheme: default
    primary: black
    accent: indigo
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
extra_css:
  - assets/custom.css
plugins:
  - search
  - glightbox
repo_url: https://github.com/BFCProduction/bfc-production-support
repo_name: BFCProduction/bfc-production-support

nav:
  - Home: index.md
  - Audio:
    - audio/index.md
    - Loading a Session on the SD12: audio/digico-sd12-loading-a-session.md
  - Video:
    - video/index.md
    - Arena Service Bumper — Auto-Start Timer: video/arena-service-bumper-timer.md
    - ATEM Output Configuration: video/atem-output-configuration.md
    - CG A Dante Virtual Soundcard: video/cg-a-dante-virtual-soundcard.md
    - PTZ Operator Instructions: video/ptz-operator-instructions.md
    - Applying a ProPresenter Theme on CG B: video/propresenter-theme-cg-b.md
    - Dana Dolly V3 Beltless:
      - video/dana-dolly/index.md
      - Compatibility: video/dana-dolly/dana-dolly-v3-compatibility.md
      - Firmware: video/dana-dolly/dana-dolly-v3-firmware.md
      - Physical Install: video/dana-dolly/dana-dolly-v3-install.md
      - Motor Engage / Disengage: video/dana-dolly/dana-dolly-v3-motor-engage.md
      - Spectrum ST4 — Sensor & Markers: video/dana-dolly/dana-dolly-v3-spectrum-sensor.md
      - Conductor SA2.6 — Sensor & Markers: video/dana-dolly/dana-dolly-v3-conductor-sensor.md
      - Calibration & First Shot: video/dana-dolly/dana-dolly-v3-calibration.md
  - Lighting:
    - lighting/index.md
    - Connecting MA3 to Arena: lighting/Connecting-MA3-to-Arena.md
    - Atrium Jands Stage CL: lighting/atrium-jands-stage-cl.md
    - Service Bumper — Arena Playback & Timer: "lighting/Service Bumper — Arena Playback & Timer System.md"
  - Network:
    - network/index.md
    - VLAN Reference: network/vlan-reference.md
    - Switch Inventory: network/switch-inventory.md
    - Port Documentation: network/port-documentation.md
    - Adding a Device: network/adding-a-device.md
    - Network Troubleshooting: network/network-troubleshooting.md
  - Workflows:
    - workflows/index.md
    - Sunday Gameday Checklist: workflows/sunday-gameday-checklist.md
    - Control Room Funeral SOP: workflows/control-room-funeral-sop.md
    - Lights & LED Wall Funeral Prep SOP: workflows/lights-led-wall-funeral-prep.md
    - Tulakes Sunday Morning Startup SOP: workflows/tulakes-sunday-morning-startup-sop.md
    - ControlFlex System Reference: workflows/controlflex-system.md
    - TV Kiosks — BFC HD Info Beamer: workflows/tv-kiosks-bfc-hd-info-beamer.md
    - Creating a New Support Page: workflows/creating-a-new-support-page.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
