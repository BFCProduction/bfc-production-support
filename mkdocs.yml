site_name: BFC Production Support
site_url: https://bfcproduction.github.io/bfc-production-support
theme:
  name: material
  logo: assets/bfc-logo.png
  favicon: assets/bfc-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
extra_css:
  - assets/custom.css
plugins:
  - search
  - glightbox
repo_url: https://github.com/BFCProduction/bfc-production-support
repo_name: BFCProduction/bfc-production-support
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
